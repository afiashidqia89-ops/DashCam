name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Capacitor 6 membutuhkan JDK 17 (Capacitor 7 ke atas baru butuh 21)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan Android SDK dan memori Gradle
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m" >> ~/.gradle/gradle.properties

      - name: Install dependensi Node
        run: npm install --no-audit --no-fund

      # Proyek native dibuat ulang oleh Capacitor setiap build, jadi selalu cocok
      # dengan versi Capacitor di package.json (tidak ada Gradle buatan tangan).
      - name: Buat proyek Android
        run: |
          rm -rf android
          npx cap add android

      - name: Terapkan kustomisasi DashCam
        run: python3 scripts/patch-android.py

      - name: Sync aset web
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log
          code=${PIPESTATUS[0]}
          exit $code

      # Jika gagal, tampilkan penyebab sebenarnya (bukan ekor stack trace)
      - name: Ringkasan penyebab error
        if: failure()
        run: |
          f=android/gradle-build.log
          if [ -f "$f" ]; then
            {
              echo '### Penyebab error Gradle'
              echo '```'
              grep -n -B2 -A25 -E 'What went wrong|FAILURE:|error:' "$f" | head -90
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Unggah log build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashcam-build-log
          path: android/gradle-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: dashcam-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

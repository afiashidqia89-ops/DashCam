name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # allow manual trigger from Actions tab

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Ubuntu runner sudah punya Android SDK pre-installed di /usr/local/lib/android/sdk.
      # Kita hanya perlu memastikan paket platform-tools, platforms;android-34, dan
      # build-tools;34.0.0 terinstall. Tidak pakai android-actions/setup-android agar
      # terhindar dari masalah input yang tidak dikenali.
      - name: Configure Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          echo "Android SDK ready: $ANDROID_SDK_ROOT"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'package.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Verify app/build.gradle uses subproject references
        working-directory: android
        run: |
          echo "=== Checking app/build.gradle for stale Maven coordinates ==="
          if grep -E "implementation\s+'com\.getcapacitor:" app/build.gradle; then
            echo ""
            echo "❌ ERROR: app/build.gradle masih memakai Maven coordinates (com.getcapacitor:...)"
            echo "   ini akan menyebabkan build gagal karena beberapa plugin Capacitor tidak"
            echo "   dipublish di Maven Central pada patch version tertentu (mis. 6.0.1)."
            echo ""
            echo "   Perbaikan:"
            echo "   1. Download zip terbaru dari assisten"
            echo "   2. Salin file android/app/build.gradle dari zip baru ke repo Anda"
            echo "   3. Verifikasi: grep \"com.getcapacitor:\" app/build.gradle  -> harus kosong"
            echo "   4. Commit & push ulang"
            exit 1
          else
            echo "✓ app/build.gradle sudah benar (menggunakan project(':capacitor-*'))"
          fi

      - name: Sync web assets to native project
        run: npx cap sync android

      - name: Generate Gradle wrapper (if missing)
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing, downloading from gradle/gradle GitHub…"
            mkdir -p gradle/wrapper
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Write local.properties (SDK path)
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashcam-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  build-release:
    name: Build Release APK (unsigned)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Verify app/build.gradle uses subproject references
        working-directory: android
        run: |
          if grep -E "implementation\s+'com\.getcapacitor:" app/build.gradle; then
            echo "❌ ERROR: app/build.gradle masih memakai Maven coordinates."
            echo "   Salin file android/app/build.gradle dari zip terbaru, lalu push ulang."
            exit 1
          fi

      - name: Sync web assets
        run: npx cap sync android

      - name: Generate Gradle wrapper (if missing)
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Write local.properties (SDK path)
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashcam-release-apk-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 60

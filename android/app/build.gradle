apply plugin: 'com.android.application'

android {
    namespace 'com.dashcam.app'
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.dashcam.app"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.fragment:fragment:1.8.0'

    // Capacitor Android core + plugins (registered automatically)
    implementation 'com.getcapacitor:capacitor-android:6.1.2'
    implementation 'com.getcapacitor:app:6.0.1'
    implementation 'com.getcapacitor:camera:6.1.1'
    implementation 'com.getcapacitor:geolocation:6.0.1'
    implementation 'com.getcapacitor:haptics:6.0.1'
    implementation 'com.getcapacitor:status-bar:6.0.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
